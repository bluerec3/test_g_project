resources:
  jobs:
    test_earthquake_end_end_job:
      name: test_earthquake_end_end_job
      tasks:
        - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: /Workspace/test_g_project/test_g_project/test_proj_bundle/src/notebooks/Ingestion to bronze
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_Silver_EarthQuake
          depends_on:
            - task_key: Ingestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.test_proj_bundle_etl.id}
        - task_key: Earthquake_Dashboard
          depends_on:
            - task_key: Bronze_Silver_EarthQuake
          dashboard_task:
            subscription: {}
            warehouse_id: 20f40d4dcd56b3ce
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
