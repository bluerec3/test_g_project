# This is a Declarative Automation Bundle definition for test_proj_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_proj_bundle
  uuid: eeb69982-5d9b-4052-be9f-d6c8bd6d50d8

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b8fc0b77-601d.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-b8fc0b77-601d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sumitsaurabh202@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sumitsaurabh202@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: sumitsaurabh202@gmail.com
        level: CAN_MANAGE
